name: Deploy WOXB Web Trader

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Trader to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            echo "================================"
            echo "Starting WOXB Trader Deployment"
            echo "================================"

            cd /var/www/trade.woxb.com

            echo "Fetching latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Building Next.js application..."
            npm run build

            echo "Restarting application..."

            if pm2 describe woxb-trader > /dev/null 2>&1; then
              pm2 restart woxb-trader --update-env
            else
              pm2 start npm --name "woxb-trader" -- start -- --port 3003
            fi

            echo "Saving PM2..."
            pm2 save

            echo "================================"
            echo "WOXB Trader deployed successfully"
            echo "================================"